<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="color-scheme" content="light">
    <meta name="description" content="图片与提示词，随手收藏，轻点复制。">
    <title>StylePrompt</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111111'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./src/AppSystem/styles.css">
    <script type="module" src="./src/AppSystem/app.js"></script>
  </head>
  <body>
    <main class="workspace">
      <header class="toolbar">
        <button id="add-entry" class="add-slot" aria-label="添加图片" title="添加图片" hidden>
          <span aria-hidden="true">＋</span>
        </button>
        <div class="toolbar-spacer"></div>
        <div class="size-control" title="卡片大小">
          <span aria-hidden="true">−</span>
          <input id="gallery-size" type="range" min="40" max="140" step="5" value="70" aria-label="卡片大小" aria-valuetext="70%">
          <span aria-hidden="true">＋</span>
        </div>
        <button id="refresh-gallery" class="icon-button" aria-label="刷新收藏" title="刷新收藏"></button>
        <button id="open-settings" class="icon-button" aria-label="仓库与编辑权限" title="仓库与编辑权限"></button>
      </header>
      <section id="gallery" class="gallery" aria-label="图片收藏"></section>
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-mark" aria-hidden="true">＋</span>
        <p id="empty-text"></p>
        <button id="empty-action" class="text-button" hidden>连接仓库</button>
      </div>
    </main>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form">
        <header class="dialog-header">
          <h1>连接收藏库</h1>
          <button type="button" class="icon-button close-settings" aria-label="关闭"></button>
        </header>
        <label for="repository">GitHub 仓库</label>
        <input id="repository" name="repository" placeholder="owner/repository" autocomplete="off" spellcheck="false" required>
        <label for="access-token">编辑凭证 <span id="token-mode-note" class="optional">可留空，只浏览</span></label>
        <input id="access-token" type="password" name="access-token" autocomplete="off" placeholder="Fine-grained personal access token" spellcheck="false">
        <label class="remember-option"><input id="remember-browser" type="checkbox" checked>记住此浏览器</label>
        <p class="field-note">仅授权此仓库的 Contents 读写权限。在自己的设备上记住凭证。</p>
        <p id="settings-error" class="error-message" role="alert"></p>
        <footer class="dialog-footer">
          <button id="logout" type="button" class="text-button" hidden>退出编辑</button>
          <button type="submit" class="primary-button">连接</button>
        </footer>
      </form>
    </dialog>

    <dialog id="editor-dialog" class="editor-dialog">
      <form id="editor-form">
        <header class="dialog-header">
          <h1 id="editor-heading">添加收藏</h1>
          <button type="button" id="close-editor" class="icon-button" aria-label="关闭"></button>
        </header>
        <div id="drop-area" class="drop-area">
          <div id="editor-images" class="editor-images" aria-label="图片顺序"></div>
          <button id="choose-images" type="button" class="choose-images" aria-label="选择图片">
            <span aria-hidden="true">＋</span><span>拖入图片，或点此选择</span>
          </button>
          <input id="image-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        </div>
        <label for="prompt">提示词</label>
        <textarea id="prompt" rows="8" placeholder="把提示词粘贴在这里…" spellcheck="false" required></textarea>
        <p id="editor-error" class="error-message" role="alert"></p>
        <footer class="dialog-footer">
          <button id="delete-entry" type="button" class="danger-button" hidden>删除整组</button>
          <div class="footer-actions">
            <button id="cancel-editor" type="button" class="secondary-button">取消</button>
            <button id="save-entry" type="submit" class="primary-button">保存</button>
          </div>
        </footer>
      </form>
    </dialog>

    <dialog id="copy-dialog" class="settings-dialog">
      <header class="dialog-header">
        <h1>复制提示词</h1>
        <button id="close-copy" class="icon-button" aria-label="关闭"></button>
      </header>
      <p class="field-note">浏览器未允许自动复制，请长按文本或按 Ctrl / ⌘ + C。</p>
      <textarea id="copy-text" rows="9" aria-label="待复制的提示词" readonly></textarea>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
